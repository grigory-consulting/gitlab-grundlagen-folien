    <script type="text/javascript">
        function pageInIframe() {
            return (window.location !== window.parent.location);
        }

        let forgetPop = true;
        function onPopState(event) {
            if(forgetPop){
                forgetPop = false;
            } else if( pageInIframe()) {
                parent.postMessage(event.target.location.href, "app://obsidian.md");
            }
        }
        window.onpopstate = onPopState;
        window.onmessage = event => {
            if(event.data == "reload"){
                window.document.location.reload();
            }
            forgetPop = true;
        }

        function fitElements() {
            const itemsToFit = document.getElementsByClassName('fitText');
            for (const item in itemsToFit) {
                if (Object.hasOwnProperty.call(itemsToFit, item)) {
                    const element = itemsToFit[item];
                    fitElement(element, 1, 1000);
                    element.classList.remove('fitText');
                }
            }
        }

        function fitElement(element, start, end) {

            let size = (end + start) / 2;
            element.style.fontSize = `${size}px`;

            if (Math.abs(start - end) < 1) {
                while (element.scrollHeight > element.offsetHeight) {
                    size--;
                    element.style.fontSize = `${size}px`;
                }
                return;
            }

            if (element.scrollHeight > element.offsetHeight) {
                fitElement(element, start, size);
            } else {
                fitElement(element, size, end);
            }
        }

        document.onreadystatechange = () => {
            fitElements();
            if (document.readyState === 'complete') {
                if (pageInIframe() && window.location.href.indexOf("?export") != -1){
                    parent.postMessage(event.target.location.href, "app://obsidian.md");
                }
                if (window.location.href.indexOf("print-pdf") != -1){
                    let stateCheck = setInterval(() => {
                        clearInterval(stateCheck);
                        window.print();
                    }, 250);
                }
            }
        };
    </script>

## Lernziele Teil V

<div class="fragment" data-fragment-index="1">

Für eine Änderung können Sie drei Fragen beantworten:

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Was startet eine Pipeline? 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Welche Prüfungen laufen in dieser Pipeline? 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Auf welche Jobs und Dateien wartet ein Job? 

<div class="fragment" data-fragment-index="5">

Der Weg: zuerst der Aufbau der Datei, dann `needs`, `workflow` und `rules`, zum Schluss `include` und `extends` im Detail.

</div>
</div></script></section><section data-separator="?
---?

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

## Drei Fragen zu einem Commit

<div class="fragment" data-fragment-index="1">

Beispiel: Ein Commit im Featurebranch korrigiert die Grenzwertprüfung zu `lower <= value <= upper`.

</div>

<div class="fragment" data-fragment-index="2">

| Frage | Beispiel | Wer entscheidet |
|---|---|---|
| Startet eine Pipeline? | Push bei offenem MR | `workflow:rules` |
| Läuft der Job mit? | `build_image` fehlt auf einem Featurebranch | Job-`rules` |
| Wann kann der Job starten? | `build_wheel` wartet auf `lint` und `unit_tests` | `stage`, `needs` |

</div>

<div class="fragment" data-fragment-index="3">

Keine Pipeline, ein fehlender Job, ein wartender Job: Das sind **drei verschiedene Ursachen**.

</div>
</div></script></section><section data-separator="?
---?

## Aufbau der Hauptdatei `.gitlab-ci.yml`

<div class="fragment" data-fragment-index="1">

Ausschnitt aus dem Projekt:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
workflow:
  rules: …

include:
  - local: .gitlab/ci/templates.yml

stages: [lint, test, build, image, verify]

lint:
  stage: lint
  …
```

</div>

<div class="fragment" data-fragment-index="3">

Die Hauptdatei legt die Stages fest und enthält die Jobs. `include` bindet eine zweite Datei ein: die Vorlage mit Image, Installation und Cache für alle Python-Jobs. Ob überhaupt eine Pipeline entsteht, entscheiden die `workflow:rules` am Dateianfang.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

## Welche Datei legt was fest?

<div class="fragment" data-fragment-index="1">

| Datei | Was sie festlegt |
|---|---|
| `.gitlab-ci.yml` | Wann läuft welcher Job? In welchem Image, mit welchen Variablen? |
| `tests/unit/` | Welche Fälle? Was gilt als richtig? |
| `pyproject.toml` | Welche Dateien kommen ins Wheel? Welche Optionen bekommt pytest? |
| `requirements-dev.txt` | Welche Werkzeuge in welcher Version? |

</div>

<div class="fragment" data-fragment-index="2">

Wer einen Test unter `tests/unit/` ändert, ändert die Prüfung der Pipeline, auch wenn das YAML gleich bleibt.

</div>
</div></script></section><section data-separator="?
---?

## YAML-Quoting

<div class="fragment" data-fragment-index="1">

```yaml
# YAML-Ausschnitt: Der Doppelpunkt gehört zum String.
script:
  - 'echo "Status: bereit"'
```

</div>

<div class="fragment" data-fragment-index="2">

Die äußeren Anführungszeichen sind für YAML. Ohne sie liest YAML `Status: bereit` als Schlüssel mit Wert, und die Konfiguration ist ungültig. Danach liest die Shell den Befehl noch einmal selbst.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

## `after_script`: eigene Shell

<div class="fragment" data-fragment-index="1">

```yaml
# Beispiel
job:
  script:
    - export STAND=fertig
  after_script:
    - echo "STAND = $STAND"    # gibt "STAND = " aus
```

</div>

<div class="fragment" data-fragment-index="2">

`before_script` und `script` laufen in derselben Shell, `after_script` in einer **eigenen Shell**. Variablen, die `script` setzt, kennt `after_script` deshalb nicht.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?

## Stages legen fest, wer wartet

<div class="fragment" data-fragment-index="1">

In der Stage `test` sind drei Jobs definiert. Der Job `build_wheel` in der Stage `build` braucht nur einen davon:

</div>

<div class="fragment" data-fragment-index="2">

| Job | Braucht `build_wheel` den Job? |
|---|---|
| `unit_tests` | Ja: Die Unit-Tests müssen grün sein |
| `integration_tests` | Nein, darauf wartet erst `build_image` |
| `scenarios` | Nein |

</div>

<div class="fragment" data-fragment-index="3">

Ohne `needs` wartet jede Stage auf die vorherige. Mit `needs` nennt ein Job die Jobs, auf die er wartet: Sie streichen so nur **unnötige** Wartezeiten, alle Tests laufen weiter.

</div>
</div></script></section><section data-separator="?
---?

<div class="fragment" data-fragment-index="2">

Der DAG (gerichteter Graph) zeigt die `needs`-Kanten der Messwertprüfung. **Ein Pfeil heißt: muss vorher fertig sein.**

</div>

## `needs` im Job `build_wheel`

<div class="fragment" data-fragment-index="1">

Ausschnitt aus `build_wheel`:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
build_wheel:
  stage: build
  extends: .python
  needs: [lint, unit_tests]
  script:
    - python -m build --wheel
    - ls -l dist/
  artifacts:
    paths: [dist/]
```

</div>

<div class="fragment" data-fragment-index="3">

Der Job startet, sobald `lint` und `unit_tests` fertig sind, ohne auf die übrigen Tests zu warten. In dieser kurzen Schreibweise wartet `needs` auf die genannten Jobs **und** lädt ihre Artifacts. Wer nur warten will, nutzt die lange Schreibweise mit `job:` und `artifacts: false`.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `needs` im Job `install_check`

<div class="fragment" data-fragment-index="1">

Ausschnitt aus `install_check`:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
install_check:
  stage: build
  image: python:3.13-slim
  needs:
    - job: build_wheel
      artifacts: true
  script:
    - python -m venv /tmp/fresh
    - /tmp/fresh/bin/pip install -q -r requirements.txt
    - /tmp/fresh/bin/pip install --no-deps dist/*.whl
```

</div>

<div class="fragment" data-fragment-index="3">

Der Job liegt in derselben Stage `build` wie `build_wheel`. Ohne `needs` starten beide gleichzeitig, und `dist/` fehlt. Mit `needs` wartet er genau auf `build_wheel`, nicht auf eine ganze Stage. `artifacts: true` ist der Standard und hier nur ausgeschrieben.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `needs` mit `artifacts: true`: Wheel übernehmen

<div class="fragment" data-fragment-index="1">

Ausschnitt aus `install_check`, gekürzt:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
install_check:
  needs:
    - job: build_wheel
      artifacts: true
  script:
    - /tmp/fresh/bin/pip install --no-deps dist/*.whl
    - cd /tmp && /tmp/fresh/bin/python -c "import messwert.app; print('INSTALL_OK')"
```

</div>

<div class="fragment" data-fragment-index="3">

`build_wheel` legt das Wheel vorher unter `dist/` ab. Im Log von `install_check` steht zuerst `Downloading artifacts for build_wheel`, am Ende `INSTALL_OK`. Mit `artifacts: false` würde der Job weiter auf `build_wheel` warten, das Wheel aber **nicht herunterladen**.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `dependencies`

<div class="fragment" data-fragment-index="1">

Alternative im Stage-Modell, also ohne `needs`. `install_check` liegt dafür in der späteren Stage `verify`:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
install_check:
  stage: verify
  image: python:3.13-slim
  dependencies: [build_wheel]
  script:
    - python -m venv /tmp/fresh
    - /tmp/fresh/bin/pip install --no-deps dist/*.whl
```

</div>

<div class="fragment" data-fragment-index="3">

Der Job wartet auf alle Jobs der früheren Stages und lädt nur die Artifacts von `build_wheel`. Die Jobs, deren Artifacts er lädt, müssen in früheren Stages liegen. **Verwenden Sie `needs` und `dependencies` nie im selben Job.**

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?

## Stage-Modell, `needs` oder `dependencies`?

<div class="fragment" data-fragment-index="1">

| Sie wollen … | Dann nutzen Sie |
|---|---|
| Auf alle Jobs einer früheren Stage warten | Stage-Modell |
| Nur auf bestimmte Jobs warten | `needs` |
| Im Stage-Modell nur die Artifacts bestimmter Jobs laden | `dependencies` |
| Nur auf bestimmte Jobs warten und ihre Artifacts laden | `needs` mit `artifacts: true` |

</div>

<div class="fragment" data-fragment-index="2">

Ohne `needs` oder eingeschränkte `dependencies` lädt ein Job standardmäßig die Artifacts aller früheren Stages. Verlassen Sie sich nicht auf Dateien, die nur zufällig da sind.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?

## `needs: optional`

<div class="fragment" data-fragment-index="1">

Beispiel: Ein Doku-Check `docs` läuft nur in manchen Pipelines.

</div>

<div class="fragment" data-fragment-index="2">

```yaml
build_wheel:
  needs:
    - job: unit_tests
    - job: docs
      optional: true
```

</div>

<div class="fragment" data-fragment-index="3">

Fehlt `docs` in der Pipeline, wartet `build_wheel` nur auf `unit_tests`. Läuft `docs` mit, wartet `build_wheel` auch darauf. `optional` gilt nur für Jobs, die fehlen: Schlägt `docs` fehl, startet `build_wheel` nicht.

</div>
</div></script></section><section data-separator="?

## Auslöser einer Pipeline und `CI_PIPELINE_SOURCE`

<div class="fragment" data-fragment-index="1">

| Auslöser | `CI_PIPELINE_SOURCE` | Genauer unterscheiden mit |
|---|---|---|
| Branch-Push | `push` | `CI_COMMIT_BRANCH` |
| Tag-Push | `push` | `CI_COMMIT_TAG` |
| MR-Ereignis | `merge_request_event` | `CI_MERGE_REQUEST_…`-Variablen |
| Zeitplan | `schedule` | `CI_COMMIT_BRANCH` oder `CI_COMMIT_TAG` |
| Start über die Oberfläche | `web` | `CI_COMMIT_BRANCH` oder `CI_COMMIT_TAG` |

</div>

<div class="fragment" data-fragment-index="2">

`push` heißt nicht automatisch „Branch“: Auch ein Tag-Push meldet `push`. GitLab setzt diese Variablen selbst und wertet sie aus, bevor ein Job startet. Was ein Skript später setzt, ändert nichts daran, welche Pipeline und welche Jobs entstehen.

</div>
</div></script></section><section data-separator="?

## `workflow:rules` im Projekt

<div class="fragment" data-fragment-index="1">

GitLab prüft die `workflow:rules` des Projekts von oben nach unten, die erste passende Regel entscheidet:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH
```

</div>

<div class="fragment" data-fragment-index="3">

Bei offenem MR ist `CI_OPEN_MERGE_REQUESTS` gefüllt: Ein Push startet dann **keine zweite Branch-Pipeline**. Die MR-Regel steht vor der `never`-Regel, deshalb entsteht die MR-Pipeline trotzdem. Die `never`-Regel fragt nicht nach dem Auslöser: Sie gilt für jede Branch-Pipeline, solange ein MR offen ist.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

## `workflow:rules`: Falltabelle

<div class="fragment" data-fragment-index="1">

So entscheiden die `workflow:rules` des Projekts:

</div>

<div class="fragment" data-fragment-index="2">

| Ereignis | Welche Pipeline entsteht |
|---|---|
| Push auf `main` | Branch-Pipeline mit allen Jobs |
| Branch-Push ohne MR | Branch-Pipeline ohne `build_image` und `container_smoke` |
| MR öffnen | MR-Pipeline |
| Push bei offenem MR | Nur die MR-Pipeline, keine zweite Branch-Pipeline |
| Tag-Push `v1.0.0` | Tag-Pipeline mit allen Jobs |
| Zeitplan, Branch ohne MR | Branch-Pipeline (letzte Regel) |

</div>
</div></script></section><section data-separator="?

" data-separator-vertical="?

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Job-`rules`: Reihenfolge der Auswertung

<div class="fragment" data-fragment-index="1">

`workflow:rules` entscheiden nur, ob eine Pipeline entsteht. Welche Jobs darin laufen, legen die Job-`rules` fest. Auch dort entscheidet die erste passende Regel:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
build_image:
  stage: image
  needs: [build_wheel, integration_tests]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - docker push "$IMAGE"
```

</div>

<div class="fragment" data-fragment-index="3">

Auf `main` passt die erste Regel, bei einem Tag die zweite. Auf einem Featurebranch passt keine Regel: **Der Job fehlt**, obwohl die Pipeline laufen darf. Mit ihm fehlt `container_smoke`: Der Job hat dieselben `rules`.

</div>
</div></script></section><section data-separator="?

## `rules:changes`

<div class="fragment" data-fragment-index="1">

Beispiel: Unit-Tests laufen im MR nur, wenn passende Dateien geändert sind:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
unit_tests:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "src/**/*"
        - "tests/**/*"
        - "requirements*.txt"
        - "pyproject.toml"
  script:
    - pytest tests/unit
```

</div>

<div class="fragment" data-fragment-index="3">

Im MR vergleicht GitLab mit dem Zielbranch. `if` **und** `changes` müssen passen: Ändert der MR eine Datei unter `src/`, läuft der Job. Ändert er nur die README, fehlt der Job in der Pipeline.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `rules:changes`: die übrigen Pipelines

<div class="fragment" data-fragment-index="1">

Mit nur dieser einen Regel fehlt `unit_tests` in jeder Branch- und Tag-Pipeline. Eine zweite Regel holt den Job dorthin zurück:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
unit_tests:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["src/**/*", "tests/**/*", "requirements*.txt", "pyproject.toml"]
    - if: $CI_PIPELINE_SOURCE != "merge_request_event"
```

</div>

<div class="fragment" data-fragment-index="3">

Im MR kann der Job weiterhin fehlen. `build_wheel` verlangt ihn per `needs`: Dort müsste `unit_tests` dann als `optional` stehen.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Nebenwirkungen von `rules`

<div class="fragment" data-fragment-index="1">

| Änderung | Mögliche Folge |
|---|---|
| `unit_tests` läuft wegen einer Regel nicht mit | `build_wheel` verlangt per `needs` einen Job, der fehlt: Die Pipeline entsteht nicht |
| Regel für MR-Pipelines fragt nur `CI_COMMIT_BRANCH` ab | Job fehlt in der MR-Pipeline: Dort ist `CI_COMMIT_BRANCH` leer |
| `changes` ohne passende `if`-Bedingung verwenden | Bei neuen Branches und Pipelines ohne Push gilt `changes` immer als erfüllt: Der Job läuft mit |

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `when: always` als Schlussregel

<div class="fragment" data-fragment-index="1">

```yaml
# Gegenbeispiel: Projekt ohne workflow:rules
unit_tests:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - when: always
  script:
    - pytest tests/unit
```

</div>

<div class="fragment" data-fragment-index="2">

Die erste Regel lässt MR-Pipelines entstehen, die letzte nimmt den Job in **jede** Pipeline auf. Ohne `workflow:rules` startet ein Push bei offenem MR deshalb zwei Pipelines, eine für den Branch und eine für den MR: `unit_tests` läuft **doppelt**. Im Projekt verhindert das die `never`-Regel in den `workflow:rules`.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `when: manual` und `allow_failure: false`

<div class="fragment" data-fragment-index="1">

Ein manueller Freigabe-Job (noch kein echtes Deployment):

</div>

<div class="fragment" data-fragment-index="2">

```yaml
approve:
  script: echo "Freigabe dokumentiert"
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
      allow_failure: false
```

</div>

<div class="fragment" data-fragment-index="3">

`when: manual`: Der Job startet erst per Klick. Mit `allow_failure: false` hält die Pipeline an, bis jemand ihn startet. Eine echte Freigabe braucht klare Rechte und etwas Konkretes, das freigegeben wird. Das `echo` gibt nichts frei.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `include`

<div class="fragment" data-fragment-index="1">

```yaml
include:
  - local: .gitlab/ci/templates.yml
```

</div>

<div class="fragment" data-fragment-index="2">

Die Pipeline entsteht aus **allen eingebundenen Dateien zusammen**. Wer nur die Hauptdatei reviewt, übersieht Änderungen an Image, Installation oder Cache-Key in `.gitlab/ci/templates.yml`.

</div>

<div class="fragment" data-fragment-index="3">

Binden Sie Vorlagen aus anderen Projekten ein, prüfen Sie auch, welche Version eingebunden wird.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `extends`: gemeinsame Jobvorlage

<div class="fragment" data-fragment-index="1">

Gekürzter Ausschnitt aus `.gitlab/ci/templates.yml` und `.gitlab-ci.yml`:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
.python:
  image: python:3.13-slim
  before_script:
    - pip install -r requirements-dev.txt

lint:
  stage: lint
  extends: .python
  script:
    - ruff check .
    - ruff format --check .
```

</div>

<div class="fragment" data-fragment-index="3">

Ein Punkt am Namensanfang heißt: Vorlage, kein eigener Job. `lint` holt sich daraus Image und Installation. Im Pipeline-Editor zeigt **Full configuration**, was GitLab daraus zusammensetzt.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `before_script` in der Vorlage `.python`

<div class="fragment" data-fragment-index="1">

Ausschnitt: Vorlage für alle Python-Jobs und der Job, der sie nicht nutzt:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
.python:
  image: python:3.13-slim
  before_script:
    - pip install -r requirements-dev.txt
install_check:
  image: python:3.13-slim
  script:
    - python -m venv /tmp/fresh
    - /tmp/fresh/bin/pip install -q -r requirements.txt
```

</div>

<div class="fragment" data-fragment-index="3">

Ein Job mit `extends: .python` installiert vor `script` die Werkzeuge aus `requirements-dev.txt`, also `ruff` und `pytest`. `install_check` übernimmt die Vorlage **bewusst nicht**: Er prüft das Wheel in einer frischen Umgebung, nur mit den Laufzeitpaketen.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `extends`: Was passiert mit Listen?

<div class="fragment" data-fragment-index="1">

```yaml
.base:
  script: [echo Basis]

test:
  extends: .base
  script: [echo Test]
```

</div>

<div class="fragment" data-fragment-index="2">

Es läuft nur **`echo Test`**, nicht vorher `echo Basis`. Verschachtelte Schlüssel wie `variables` führt GitLab Eintrag für Eintrag zusammen, aber eine neue `script`-Liste ersetzt die geerbte.

</div>

<div class="fragment" data-fragment-index="3">

Listen hängt GitLab nicht aneinander. Gemeinsame Schritte gehören deshalb in `before_script` oder in eine Skriptdatei.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Fehlersuche: Pipeline und Jobs

<div class="fragment" data-fragment-index="1">

| Symptom | Zuerst prüfen |
|---|---|
| Keine Pipeline | Workflow und tatsächlichen Auslöser |
| Erwarteter Job fehlt | Erste passende Job-Regel |
| Pipeline meldet Konfigurationsfehler, kein Job startet | `needs` auf fehlenden Job |
| Job wartet | Vorgänger, Runner-Zuordnung, freie Runner |
| Job ist rot | Job-Log: wo das Skript abbricht |

</div>

<div class="fragment" data-fragment-index="2">

CI Lint und das zusammengeführte YAML (**Full configuration** im Pipeline-Editor) zeigen, ob die Konfiguration stimmt. Ob die Werkzeuge da sind und der Job auf dem Runner durchläuft, zeigen sie nicht.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Rückblick Teil V

<div class="fragment" data-fragment-index="1">

**Pipeline ja/nein → welche Jobs → worauf warten sie**: drei getrennte Fragen.

</div>

<div class="fragment" data-fragment-index="2">

Bei offenem MR testet genau eine Pipeline die Korrektur der Grenzwertprüfung: die MR-Pipeline. `build_wheel` wartet nur auf `lint` und `unit_tests`. Vorlagen helfen, solange das zusammengeführte YAML lesbar bleibt.

</div>

<div class="fragment" data-fragment-index="3">

Als Nächstes: welche Variablen ein Job bekommt und wie Jobs Dateien weitergeben.

</div>
</div></script></section></section><section ><section data-separator="?

# Teil VI · Secrets und Pipeline-Daten
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Lernziele Teil VI

<div class="fragment" data-fragment-index="1">

Sie können:

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->erklären, welchen Wert eine Variable im Job wirklich hat, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Zugriff auf Secrets und Maskierung im Log unterscheiden, 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Cache und Artifacts unterscheiden und getrennt einsetzen. 

<div class="fragment" data-fragment-index="5">

Dafür nutzt das Projekt die Variable `APP_TITLE`, ein Dummy-Secret, einen pip-Cache und das Wheel, das ein zweiter Job in frischer Umgebung installiert.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Vordefinierte Variablen: Pipeline-Quelle, Ref und Commit

<div class="fragment" data-fragment-index="1">

Im GitLab-Job:

</div>

<div class="fragment" data-fragment-index="2">

```bash
echo "$CI_PIPELINE_SOURCE"
echo "$CI_COMMIT_REF_NAME"
echo "$CI_COMMIT_SHORT_SHA"
```

</div>

<div class="fragment" data-fragment-index="3">

Beispielausgabe in der MR-Pipeline des Branches `doku/hinweis`:

</div>

<div class="fragment" data-fragment-index="4">

```text
merge_request_event
doku/hinweis
<die ersten 8 Zeichen des Commits>
```

</div>

<div class="fragment" data-fragment-index="5">

Diese drei Werte zeigen, welchen Stand der Job geprüft hat. Auf Ihrem Rechner gibt es diese Variablen nicht. Geben Sie zur Diagnose nicht alle Umgebungsvariablen aus: Darunter können Secrets sein.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `variables` global und im Job

<div class="fragment" data-fragment-index="1">

```yaml
variables:
  APP_TITLE: "Messwertprüfung (aus .gitlab-ci.yml)"

show_variables:
  image: alpine:3.20
  when: manual
  variables:
    APP_TITLE: "Messwertprüfung (aus dem Job)"
  script:
    - echo "APP_TITLE = $APP_TITLE"
```

</div>

<div class="fragment" data-fragment-index="2">

Die Variable im Job überschreibt die globale: Der Job gibt **`APP_TITLE = Messwertprüfung (aus dem Job)`** aus. `APP_TITLE` ist ein harmloser Anzeigetext, kein Secret.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Rangfolge: Projektvariable vor YAML

<div class="fragment" data-fragment-index="1">

`APP_TITLE` ist an bis zu drei Stellen definiert. Der Job gibt aus:

</div>

<div class="fragment" data-fragment-index="2">

| `APP_TITLE` ist definiert … | Ausgabe im Job |
|---|---|
| nur global im YAML | `Messwertprüfung (aus .gitlab-ci.yml)` |
| zusätzlich im Job | `Messwertprüfung (aus dem Job)` |
| zusätzlich in den Projekteinstellungen | `Messwertprüfung (aus Projekteinstellung)` |

</div>

<div class="fragment" data-fragment-index="3">

Die Projektvariable aus **Settings › CI/CD › Variables** überschreibt beide YAML-Werte. Die Tabelle zeigt nur diese drei Fälle. Gruppen-, Instanz- und Pipeline-Variablen haben eigene Plätze in der Rangfolge:

</div>

<div class="fragment" data-fragment-index="4">

[GitLab: welche Variable gewinnt](https://docs.gitlab.com/ci/variables/#cicd-variable-precedence)

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Variablen in Projekt, Gruppe, Instanz

<div class="fragment" data-fragment-index="1">

| Angelegt in | Gilt für | Geeignet für |
|---|---|---|
| Projekt | Dieses Projekt | Wert, den nur dieses Projekt braucht |
| Gruppe | Alle Projekte der Gruppe | Wert, den mehrere Projekte teilen |
| Instanz | Alle Projekte und Gruppen | Zentrale Einstellung der Admins |

</div>

<div class="fragment" data-fragment-index="2">

Projekte erben Gruppenwerte. Ein Secret in der Gruppe bekommen deshalb alle ihre Projekte, auch die, die es nicht brauchen. Je höher die Ebene (Gruppe, Instanz), desto mehr Projekte trifft ein Fehler.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Environment-Scope und `protected`

<div class="fragment" data-fragment-index="1">

```yaml
# Environment: benanntes Deploymentziel in GitLab. Hier nur benannt, kein Deploy.
deploy_preview:
  environment:
    name: review/doku-hinweis
  script: echo "Umgebung benannt"
```

</div>

<div class="fragment" data-fragment-index="2">

Eine Variable mit dem Scope `review/*` bekommt nur ein Job, dessen `environment`-Name auf dieses Muster passt, hier `review/doku-hinweis`. `protected` ist etwas anderes: Es richtet sich nach geschützten **Branches oder Tags**. Den Scope legen Sie beim Anlegen der Variable fest.

</div>

<div class="fragment" data-fragment-index="3">

Environment-Scope für Gruppenvariablen gibt es nur in Premium/Ultimate. Für Projektvariablen gibt es ihn in allen Tiers.

</div>

<div class="fragment" data-fragment-index="4">

[GitLab: Gruppenvariablen und Environment-Scope](https://docs.gitlab.com/ci/variables/#for-a-group)

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="dense drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Protected Variables

<div class="fragment" data-fragment-index="1">

Eine geschützte Variable bekommen nur Pipelines auf geschützten Branches oder Tags.

</div>

<div class="fragment" data-fragment-index="2">

Ein Featurebranch bekommt sie nicht automatisch. `TRAINING_DUMMY_SECRET` ist `protected`. `show_variables` gibt es aus:

</div>

<div class="fragment" data-fragment-index="3">

```yaml
script:
  - echo "Secret    = $TRAINING_DUMMY_SECRET"
```

</div>

<div class="fragment" data-fragment-index="4">

| Pipeline auf | Branch geschützt? | Ausgabe im Joblog |
|---|---|---|
| `main` | ja | `Secret    = [MASKED]` |
| `test/secret` | nein | `Secret    =` |

</div>

<div class="fragment" data-fragment-index="5">

Auf `main` kommt der Wert an, GitLab zeigt ihn nur maskiert. Auf dem ungeschützten Branch bleibt die Variable leer; der Job läuft trotzdem grün durch, weil eine leere Variable kein Fehler ist.

</div>

<div class="fragment" data-fragment-index="6">

**Der Schutz legt fest, welche Pipelines den Wert bekommen.** Was der Code dann damit macht, prüft er nicht.

</div>

<div class="fragment" data-fragment-index="7">

[GitLab: Protected Variables](https://docs.gitlab.com/ci/variables/#protect-a-cicd-variable)

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Bekommt der Job die Variable?

<div class="fragment" data-fragment-index="1">

Prüfen Sie zuerst, ob der Job den Wert überhaupt bekommt, dann, welcher Wert gewinnt. Eine Projektvariable kann Vorrang haben und für diesen Job trotzdem nicht gelten.

</div>

<div class="fragment" data-fragment-index="2">

| Prüfung | Beispiel |
|---|---|
| Richtiges Projekt, richtige Gruppe? | Variable ist in diesem Projekt oder seiner Gruppe angelegt |
| Passendes Environment? | Variable hat den Scope `review/*`: nur für Jobs mit passendem `environment` |
| Läuft der Job auf geschütztem Ref? | Variable ist `protected`: nur auf geschützten Branches und Tags |
| Danach: Welcher Wert gewinnt? | Die Projektvariable überschreibt den Wert aus dem YAML |

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Geschützte Variablen und Runner in MR-Pipelines

<div class="fragment" data-fragment-index="1">

Damit eine MR-Pipeline geschützte Variablen und Runner bekommt, muss gelten:

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Quell- **und** Zielbranch sind geschützt und liegen im selben Projekt. 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Wer die Pipeline startet, darf auf den Zielbranch pushen oder mergen. 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Die Option **Allow merge request pipelines to access protected variables and runners** ist im Projekt eingeschaltet. 

<div class="fragment" data-fragment-index="5">

MRs aus Forks bekommen diese Variablen und Runner so nicht. Lesen Sie fremden Pipelinecode, bevor er im Zielprojekt läuft.

[GitLab: Protected Resources in MR-Pipelines](https://docs.gitlab.com/ci/pipelines/merge_request_pipelines/#control-access-to-protected-variables-and-runners)

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Maskierung im Job-Log

<div class="fragment" data-fragment-index="1">

Gibt ein Job den exakten Wert einer maskierten Variable aus, steht im Log `[MASKED]`, auf `main` etwa `Secret    = [MASKED]`. Schickt er den Wert verändert (z. B. Base64-kodiert) oder auf anderem Weg hinaus, hilft die Maskierung nicht.

</div>

<div class="fragment" data-fragment-index="2">

Gegen bösartigen Jobcode hilft Maskierung nicht: Er kann jeden Wert lesen, den der Job bekommt, egal was im Log steht.

</div>

<div class="fragment" data-fragment-index="3">

Deshalb braucht jede Änderung an YAML, eingebundenen Dateien und Skripten ein Review, auch bei maskierten und geschützten Werten, besonders bei fremden Pipelines.

</div>

<div class="fragment" data-fragment-index="4">

[GitLab: Variablensicherheit und Maskierung](https://docs.gitlab.com/ci/variables/#cicd-variable-security)

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `masked`, `hidden`, `protected`

<div class="fragment" data-fragment-index="1">

| Einstellung | Frage | Schützt nicht vor … |
|---|---|---|
| `masked` | Wird der Wert im Log ersetzt? | Code, der den Wert verändert ausgibt oder verschickt |
| `hidden` | Zeigt die UI den Wert nach dem Speichern noch an? | Lesen im Job |
| `protected` | Bekommt dieser Ref den Wert? | Unsicherem Pipelinecode |

</div>

<div class="fragment" data-fragment-index="2">

Echte Secrets brauchen zusätzlich minimale Rechte, kurze Laufzeit, Rotation und Kontrolle darüber, welcher Code läuft.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## File-Variablen

<div class="fragment" data-fragment-index="1">

Eine Variable vom Typ **File** legen Sie in den Projekteinstellungen an. GitLab schreibt ihren Inhalt für den Job in eine temporäre Datei:

</div>

<div class="fragment" data-fragment-index="2">

| Bestandteil | Dummy-Beispiel |
|---|---|
| Name in den Projekteinstellungen | `TRAINING_FILE` |
| Gespeicherter Inhalt | Zwei fiktive Zeilen: `FIKTIVE_KURSDATEI`, `Zeile 2` |
| Wert der Variable im Job | Pfad zu einer temporären Datei, z. B. `/builds/schulung/messwert-tnXX.tmp/TRAINING_FILE` |

</div>

<div class="fragment" data-fragment-index="3">

Ein Werkzeug bekommt also einen **Dateipfad**, nicht den Inhalt. Eine normale YAML-Variable wird durch Name oder Endung nicht zur File-Variable.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## File-Variable im Job lesen

<div class="fragment" data-fragment-index="1">

Ausschnitt aus `show_variables`:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
show_variables:
  script:
    - echo "Secret    = $TRAINING_DUMMY_SECRET"
    - echo "TRAINING_FILE = $TRAINING_FILE"
    - cat "$TRAINING_FILE"
```

</div>

<div class="fragment" data-fragment-index="3">

`echo` zeigt den Pfad, erst `cat` liest den Inhalt. Liegt in der Datei später ein echtes Zertifikat, prüft `cat` nicht, ob es gültig ist oder die Anmeldung klappt.

</div>

<div class="fragment" data-fragment-index="4">

Secret-Dateien gehören nicht in Cache, Wheel oder Diagnose-Artifacts.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Ausgabe von `show_variables`

<div class="fragment" data-fragment-index="1">

Auf `main`, mit Secret und File-Variable, ohne Projektvariable `APP_TITLE`:

</div>

<div class="fragment" data-fragment-index="2">

```text
APP_TITLE = Messwertprüfung (aus dem Job)
Secret    = [MASKED]
TRAINING_FILE = /builds/schulung/messwert-tnXX.tmp/TRAINING_FILE
FIKTIVE_KURSDATEI
Zeile 2
```

</div>

<div class="fragment" data-fragment-index="3">

Auf einem ungeschützten Branch bleibt nur die Secret-Zeile leer. Um zu prüfen, ob das Secret ankommt, brauchen Sie den echten Wert nicht zu sehen.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Externe Secret-Manager

<div class="fragment" data-fragment-index="1">

| CI-Variable | Externer Secret-Manager |
|---|---|
| GitLab gibt dem Job den gespeicherten Wert | Job holt sich einen bestimmten Wert ab |
| GitLab-Einstellungen regeln, wer ihn bekommt | Der Secret-Manager prüft zusätzlich, welcher Job fragt und was er lesen darf |
| Schutz und Review bleiben nötig | Schutz und Review bleiben nötig |

</div>

<div class="fragment" data-fragment-index="2">

Die eingebauten GitLab-Integrationen gibt es nur in **Premium/Ultimate**. Mit einem ID-Token, das GitLab ausstellt, weist sich ein Job beim Secret-Manager aus. Die Policy dort müssen Sie trotzdem eng fassen.

</div>

<div class="fragment" data-fragment-index="3">

[GitLab: External Secrets](https://docs.gitlab.com/ci/secrets/)

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Cache und Artifacts im Vergleich

<img src="figs/cache-artifacts.png" alt="Artifacts übergeben Jobausgaben; Cache ermöglicht die optionale Wiederverwendung von pip-Paketen." style="object-fit: scale-down" class="fragment" data-fragment-index="1">


<div class="fragment" data-fragment-index="2">

**Der Cache darf fehlen.** Das Wheel muss dagegen als Artifact aus dem Job `build_wheel` kommen.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `.cache/pip` als Cache, `dist/` als Artifact

<div class="fragment" data-fragment-index="1">

Im Projekt installiert jeder Job mit `extends: .python` die festgeschriebenen Versionen aus `requirements-dev.txt`.

</div>

<div class="fragment" data-fragment-index="2">

| Ordner | Verwendung | Zweck |
|---|---|---|
| `.cache/pip` | Cache aller `.python`-Jobs | Downloads aus einem früheren Lauf wiederverwenden |
| `dist/` | Artifact von `build_wheel` | Wheel an spätere Jobs weitergeben |

</div>

<div class="fragment" data-fragment-index="3">

Findet ein Job keinen Cache, lädt `pip` dieselben Versionen neu herunter. Das Wheel bekommen spätere Jobs nur über das Artifact, egal ob es einen Cache gab.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Cache-Key aus der Abhängigkeitsdatei

<div class="fragment" data-fragment-index="1">

```yaml
.python:
  variables:
    PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  cache:
    key:
      files: [requirements-dev.txt]
    paths: [.cache/pip]
```

</div>

<div class="fragment" data-fragment-index="2">

`requirements-dev.txt` legt die Werkzeuge fest, z. B. `pytest==9.2.0`. Der Key benennt den Cache: Ändert ein Commit diese Datei, entsteht ein neuer, leerer Cache. Auf geschützten Branches hängt GitLab `-protected` an: `main` und Featurebranches teilen sich keinen Cache.

</div>

<div class="fragment" data-fragment-index="3">

GitLab cacht nur Pfade im Projektordner, deshalb zeigt `PIP_CACHE_DIR` dorthin. Die Python-Version steckt nicht im Key: Nach einem Imagewechsel gilt derselbe Cache weiter.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Cache-Policy: `pull`, `push`, `pull-push`

<div class="fragment" data-fragment-index="1">

| Policy | Vorhandenen Cache lesen | Eigenen Cache hochladen |
|---|---|---|
| `pull` | Ja | Nein |
| `push` | Nein | Ja |
| `pull-push` | Ja | Ja |

</div>

<div class="fragment" data-fragment-index="2">

Standard ist `pull-push`. Schreiben mehrere Jobs parallel in denselben Key, können sie sich gegenseitig stören. Einfacher zu durchschauen: Ein Job schreibt, die anderen lesen nur.

</div>

<div class="fragment" data-fragment-index="3">

Dass die Pipeline dadurch schneller wird, ist nicht garantiert.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Cache-Miss: Treffer oder nicht

<div class="fragment" data-fragment-index="1">

| Situation | Was es bedeutet |
|---|---|
| `Successfully extracted cache` | Treffer, `pip` lädt nichts herunter |
| `Cache file does not exist` | Kein Treffer (Cache-Miss), `pip` lädt neu: nur langsamer, alles in Ordnung |
| Pakete schon im Image enthalten | Kein Cache nötig: Das Image legt die Versionen fest |
| Andere Version im Cache | Unkritisch: `pip` installiert die Version aus `requirements-dev.txt` |
| Anderer Runner findet lokalen Cache nicht | Prüfen, wo der Cache gespeichert ist |

</div>

<div class="fragment" data-fragment-index="2">

Der Kursrunner speichert den Cache lokal und getrennt je Slot: Derselbe Job kann ihn einmal treffen und einmal verfehlen und ist beide Male grün.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Fallback-Keys

<div class="fragment" data-fragment-index="1">

```yaml
# Beispiel
cache:
  key: "pip-$CI_COMMIT_REF_SLUG"
  fallback_keys: ["pip-main"]
  paths: [.cache/pip]
```

</div>

<div class="fragment" data-fragment-index="2">

Ein Fallback-Key nennt einen zweiten Cache für den Fall, dass der erste fehlt: Ein neuer Branch startet hier mit dem Cache von `main`. Das lohnt sich nur, wenn der alte Inhalt noch passt.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Wheel-Artifact: Inhalt und Prüfung

<div class="fragment" data-fragment-index="1">

`python -m build --wheel` erzeugt `dist/messwert-1.0.0-py3-none-any.whl`.

</div>

<div class="fragment" data-fragment-index="2">

| Im Wheel | Nicht im Wheel |
|---|---|
| Paket `messwert` aus `src/` | pip-Cache `.cache/pip` |
| HTML-Templates über `package-data` | Tests |
| Liste der Abhängigkeiten aus `pyproject.toml`, nicht die Pakete selbst | Secret-/Environment-Dateien |

</div>

<div class="fragment" data-fragment-index="3">

`install_check` installiert das Wheel in einer frischen Umgebung und importiert `messwert.app`. **Dass `python -m build` durchläuft, reicht nicht:** Fehlt `package-data`, fehlen die Templates. Der Import klappt trotzdem, und erst `container_smoke` wird rot.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `expire_in`: Lebensdauer von Artifacts

<div class="fragment" data-fragment-index="1">

Ausschnitt aus dem Job `build_wheel`:

</div>

<div class="fragment" data-fragment-index="2">

```yaml
build_wheel:
  artifacts:
    paths: [dist/]
    expire_in: 1 week
```

</div>

<div class="fragment" data-fragment-index="3">

Die eine Woche hat das Projekt festgelegt. Das ist kein GitLab-Default und keine Zusage, dass das Wheel dauerhaft archiviert wird.

</div>

<div class="fragment" data-fragment-index="4">

Klären Sie einzeln: Wie lange heben wir das Wheel auf? Wer braucht es nach Ablauf noch? Wie stellen wir es wieder her? Neu bauen aus einem versionierten Stand ist zuverlässiger als ein alter Download.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Wheel in `install_check` prüfen

<div class="fragment" data-fragment-index="1">

`install_check` installiert `dist/*.whl`. Mit `artifacts: false` im `needs`-Eintrag wird er rot:

</div>

<div class="fragment" data-fragment-index="2">

```text
WARNING: Requirement 'dist/*.whl' looks like a filename, but the file does not exist
```

</div>

<div class="fragment" data-fragment-index="3">

| Symptom | Prüfung |
|---|---|
| `build_wheel` grün, `install_check` findet kein Wheel | Pfad und `needs:artifacts` |
| Wheel installiert, Import scheitert | Laufzeitpakete in `requirements.txt` |
| Import klappt, Templates fehlen | `package-data` in `pyproject.toml` |
| Wheel enthält alten Stand | Mit aktuellem Quellstand vergleichen |

</div>

<div class="fragment" data-fragment-index="4">

Ein `echo "Paket erhalten"` prüft davon nichts.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Abgelaufene und gelöschte Artifacts

<div class="fragment" data-fragment-index="1">

Ist ein benötigtes Artifact gelöscht oder abgelaufen, kann der Job fehlschlagen, der es braucht.

</div>

<div class="fragment" data-fragment-index="2">

Hat ein früherer Job dagegen **gar kein Artifact erzeugt**, liegt der Fehler in dessen Skript oder `paths`. Die GitLab-Doku behandelt beide Fälle getrennt.

</div>

<div class="fragment" data-fragment-index="3">

Starten Sie den Job neu, der das Artifact erzeugt, oder ändern Sie, wie es übergeben wird. Ein zufällig vorhandener Cache ersetzt nicht das Wheel-Artifact aus dem richtigen Commit.

</div>

<div class="fragment" data-fragment-index="4">

[GitLab: `dependencies` und abgelaufene Artifacts](https://docs.gitlab.com/ci/yaml/#dependencies)

</div>
</div></script></section><section data-separator="?

## Rückblick Teil VI

<div class="fragment" data-fragment-index="1">

Bei einer Variable: Wo ist sie definiert, bekommt der Job sie, welcher Wert gewinnt? Bei einem Secret auch: Welcher Code darf laufen?

</div>

<div class="fragment" data-fragment-index="2">

Bei Dateien: Kommt die richtige Datei an, stimmt ihr Inhalt, wie lange bleibt sie verfügbar? Der Cache spart Zeit, Artifacts reichen Dateien weiter.

</div>

<div class="fragment" data-fragment-index="3">

Im nächsten Teil geht es darum, wo Jobs laufen, und um Tests und Reports.

</div>

</div></script></section><section data-separator="?

## Lernziele Teil VII

<div class="fragment" data-fragment-index="1">

Sie können:

</div>

- &shy;<!-- .element: class="fragment" data-fragment-index="2" -->sagen, wer einen Runner nutzt, wie er Jobs ausführt und was er darf, 
- &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Jobimage, Service, Builder und Produktimage unterscheiden, 
- &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Tests, Exit-Code, JUnit, Coverage und Image-Digest einzeln auswerten.
</div></script></section><section data-separator="?
---?

" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->

## Runner-Scopes: Instance, Group, Project

<div class="fragment" data-fragment-index="1">

| Runner-Scope | Zuordnung | Frage für das Projekt |
|---|---|---|
| Instance | Alle Projekte der Instanz | Mit wem teilen wir uns den Runner? |
| Group | Gruppe und Untergruppen | Wer darf Jobcode darauf laufen lassen? |
| Project | Nur zugewiesene Projekte | Dürfen weitere Projekte ihn nutzen? |

</div>

<div class="fragment" data-fragment-index="2">

Auch ein Project-Runner kann mehreren Projekten dienen. **Der Host gehört Ihnen damit nicht allein.**

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Executor: Shell, Docker, Kubernetes

<div class="fragment" data-fragment-index="1">

| Executor | Wo der Job läuft | Worauf es für den Job ankommt |
|---|---|---|
| Shell | Prozess auf dem Host | Werkzeuge und Rechte des Hosts |
| Docker | Im Jobcontainer | Image, Mounts und Privilegien |
| Kubernetes | Pod mit Build-/Servicecontainern | Clusterrechte und Policies |

</div>

<div class="fragment" data-fragment-index="2">

Scope und Executor wählen Sie unabhängig. Derselbe Testjob läuft daher je nach Runner gut abgeschottet oder nicht.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Runner-Registrierung mit Authentication-Token

<div class="fragment" data-fragment-index="1">

So registrieren Sie einen Runner:

</div>

1. &shy;<!-- .element: class="fragment" data-fragment-index="2" -->Runner in der GitLab-UI oder per API anlegen. 
1. &shy;<!-- .element: class="fragment" data-fragment-index="3" -->Token kopieren: Es beginnt mit `glrt-`. 
1. &shy;<!-- .element: class="fragment" data-fragment-index="4" -->Runner auf dem Host mit dem Token registrieren, Executor einstellen. 

<div class="fragment" data-fragment-index="5">

```bash
gitlab-runner register --token "$RUNNER_AUTHENTICATION_TOKEN"
```

Der Befehl meldet den Runner nur an. Welche Projekte ihn nutzen und ob er geschützt ist (nur für geschützte Branches und Tags), stellen Sie in GitLab ein. Zeigen Sie das Token nie im Log oder auf dem Bildschirm. Der frühere Weg über Registration-Tokens ist abgekündigt.

[GitLab: Runner-Registrierungsworkflow](https://docs.gitlab.com/ci/runners/new_creation_workflow/)

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Runner-Tags

<div class="fragment" data-fragment-index="1">

```yaml
# Gegenbeispiel: ein Tag, den kein Runner hat
integration_tests:
  stage: test
  tags: [absichtlich-kein-runner]
```

</div>

<div class="fragment" data-fragment-index="2">

| Runner-Tags | Nimmt er `integration_tests`? |
|---|---|
| `docker` (Kursrunner `schulung-docker-runner`) | Nein, der Job bleibt `pending` |
| `absichtlich-kein-runner` | Ja |
| `absichtlich-kein-runner, linux` | Ja |

</div>

<div class="fragment" data-fragment-index="3">

Ohne `tags` im Job nimmt der Kursrunner den Job. Ein Runner braucht alle Tags des Jobs, muss dem Projekt zugeordnet, für den Ref erlaubt und frei sein. Runner-Tags sind keine Git-Tags und sagen nichts über Sicherheit.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Diagnose: Job bleibt `pending`

<div class="fragment" data-fragment-index="1">

| Was Sie sehen | Was Sie prüfen |
|---|---|
| Kein passender Runner angezeigt | Dem Projekt zugeordnet und online? |
| Runner hat nur einige Jobtags | Alle Tags des Jobs vergleichen |
| Geschützter Runner, Ref passt nicht | Schutzregeln prüfen |
| Passender Runner ist belegt | Freie Slots und Warteschlange |

</div>

<div class="fragment" data-fragment-index="2">

Solange der Job wartet, startet sein Skript nicht, und es gibt kein Log. An einem Fehler in `validation.py` kann es nicht liegen.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?

<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `needs` und Runner-Kapazität

<div class="fragment" data-fragment-index="1">

Mit `needs` wartet ein Job nur auf die Jobs, die er braucht. Ob er dann sofort startet, hängt an freien Runnern.

</div>

<div class="fragment" data-fragment-index="2">

Eine Testmatrix (`parallel:matrix`) macht aus einem Job mehrere. Gibt es zu wenig Slots, laufen sie nacheinander statt parallel.

</div>

<div class="fragment" data-fragment-index="3">

**Drei Zustände:** wartet auf andere Jobs, wartet auf einen Runner, läuft.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="dense drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Was ein Job auf dem Runner darf

<img src="figs/runner-trust.png" alt="Zielbild: kontrollierter Runner-Zugriff, begrenzter Jobcontainer, Builder, Registry und Logs." style="max-height: 300px; object-fit: scale-down" class="fragment" data-fragment-index="1">


- Über Scope und Tags legt die Runner-Policy fest, welche Jobs der Runner annimmt. <!-- .element: class="fragment" data-fragment-index="2" -->
- Jeder Job läuft in einem eigenen Container. Den Docker-Socket des Hosts erreicht das Jobskript nicht. <!-- .element: class="fragment" data-fragment-index="3" -->
- Für die Produktion baut ein Builder ohne Root-Rechte das Image. Im Kurs übernimmt das Docker-in-Docker im privilegierten Modus. In die Registry schiebt der Job das Image mit dem Job-Token. <!-- .element: class="fragment" data-fragment-index="4" -->
- Die Job-Logs bleiben in GitLab für Audit und Diagnose. <!-- .element: class="fragment" data-fragment-index="5" -->

<div class="fragment" data-fragment-index="6">

**Jobcode darf alles, was der Runner ihm erlaubt.**

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Vier Containerrollen im Projekt

<div class="fragment" data-fragment-index="1">

| Rolle | Im Projekt | Aufgabe |
|---|---|---|
| Jobimage | `python:3.13-slim` | Python und pip, Werkzeuge aus `requirements-dev.txt` |
| Service | `postgres:17-alpine`, Alias `db` | Datenbank für Integrations- und Smoke-Test |
| Builder | `docker:27` mit Service `docker:27-dind` | Baut das Image aus dem Dockerfile |
| Produktimage | Messwertprüfung (`uvicorn`) | Die Anwendung selbst, erreichbar auf Port `8080` |

</div>

<div class="fragment" data-fragment-index="2">

`docker build` braucht einen Docker-Daemon, und im Jobcontainer läuft nicht automatisch einer. Auch mit `image: docker:27` fehlt er noch: Im Projekt liefert ihn der Service `docker:27-dind`.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Service-Container über den Alias erreichen

<div class="fragment" data-fragment-index="1">

Job mit Service (Ausschnitt):

</div>

<div class="fragment" data-fragment-index="2">

```yaml
integration_tests:
  services:
    - name: postgres:17-alpine
      alias: db
  variables:
    POSTGRES_DB: messwert
    POSTGRES_USER: app
    POSTGRES_PASSWORD: nur-fuer-tests
    DATABASE_URL: "postgresql://app:nur-fuer-tests@db:5432/messwert"
  script:
    - pytest tests/integration --junitxml=report-integration.xml
```

</div>

<div class="fragment" data-fragment-index="3">

Unter dem Alias `db` erreicht der Job den Servicecontainer, `localhost` klappt beim Docker-Executor nicht. `POSTGRES_…` liest der Service beim Start, `DATABASE_URL` die Anwendung. Die Testwerkzeuge stammen aus dem Jobimage.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Testdaten des Integrationstests

<div class="fragment" data-fragment-index="1">

Der Test lädt diese CSV hoch:

</div>

<div class="fragment" data-fragment-index="2">

```text
device,value,lower,upper,unit
Sensor-A,20.3,19,21,C
Sensor-B,23.1,19,21,C
Sensor-C,19,19,21,C
```

</div>

<div class="fragment" data-fragment-index="3">

Sensor-B liegt außerhalb. Sensor-C liegt mit 19 genau auf der unteren Grenze und gehört zum Bereich. Der Test erwartet deshalb drei Messwerte, davon **einen außerhalb**.

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## Integrationstest: speichern und wieder lesen

<div class="fragment" data-fragment-index="1">

Der Integrationstest prüft den Weg durch API und PostgreSQL:

</div>

<div class="fragment" data-fragment-index="2">

```python
def test_report_is_saved_and_read_back(client):
    response = client.post("/api/reports", files={"datei": ("messung.csv", CSV, "text/csv")})
    assert response.status_code == 201, response.text
    report_id = response.json()["id"]

    read_back = client.get(f"/api/reports/{report_id}").json()
    assert read_back["dateiname"] == "messung.csv"
    assert read_back["anzahl"] == 3
    assert read_back["ausserhalb"] == 1
```

</div>

<div class="fragment" data-fragment-index="3">

Der Test verlangt den gespeicherten Bericht mit Dateiname und Zählung zurück. **Dass die Datenbank antwortet, genügt nicht: Der Test zeigt, dass die Daten dort ankommen.**

</div>
</div></script></section><section data-separator="?
---?
" data-separator-vertical="?
--?
" data-separator-notes="note:" data-markdown><script type="text/template"><!-- .slide: class="drop" template="" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 720px; width: 1280px; min-height: 720px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

## `integration_tests` rot: falscher Host oder Fehler am Grenzwert

<div class="fragment" data-fragment-index="1">

| Änderung | Ausgabe in `integration_tests` | Ursache |
|---|---|---|
| Host `datenbank` statt `db` | `failed to resolve host 'datenbank'`, `6 errors` nach ca. 30 s | Service unter diesem Namen nicht erreichbar |
| `lower < value` statt `lower <= value` | `assert 2 == 1`: Sensor-C liegt genau auf der Grenze und zählt als außerhalb | Programm entscheidet den Grenzwert falsch |

</div>

<div class="fragment" data-fragment-index="2">

Ein Verbindungsfehler tritt schon beim Vorbereiten des Tests auf und erscheint als `error`. Ein falsch entschiedener Messwert erscheint als `failed`.

</div>

<div class="fragment" data-fragment-index="3">

Der Integrationstest findet den Fehler am Grenzwert auch. Die Unit-Tests ersetzt er nicht: Sie finden ihn schneller und ohne Datenbank. Der Endpunkt `/ready` sagt nur, dass die Datenbank erreichbar ist.

</div>
</div></script></section><section data-separator="?
